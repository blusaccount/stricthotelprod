<!DOCTYPE html>
<html lang="de">
<head>
        <script src="/shared/js/iframe-helper.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
    <link rel="stylesheet" href="/shared/css/theme.css">
    <link rel="stylesheet" href="blackjack.css">
    <link rel="stylesheet" href="/shared/fonts/press-start-2p.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <a class="back-link" href="/games/casino/">CASINO</a>
            <div class="title">BLACKJACK</div>
            <div class="balance">Balance: <span id="balance-display">…</span> SC</div>
        </div>

        <div class="machine">
            <div class="table">
                <div class="dealer-area">
                    <div class="hand-label">DEALER <span id="dealer-total" class="hand-total">—</span></div>
                    <div class="hand" id="dealer-hand"></div>
                </div>

                <div class="status-row">
                    <div class="status" id="status" data-kind="info">Choose a bet and deal.</div>
                </div>

                <div class="player-area">
                    <div class="hand-label">YOU <span id="player-total" class="hand-total">—</span></div>
                    <div class="hand" id="player-hand"></div>
                </div>

                <div class="result-banner" id="result-banner" hidden>
                    <div class="result-text" id="result-text">WIN</div>
                    <div class="result-amount" id="result-amount">+0 SC</div>
                </div>
            </div>

            <div class="controls">
                <div class="block">
                    <div class="block-label">BET</div>
                    <div class="bets" id="bet-grid">
                        <button class="bet-btn" data-bet="5">5</button>
                        <button class="bet-btn" data-bet="10">10</button>
                        <button class="bet-btn" data-bet="25">25</button>
                        <button class="bet-btn" data-bet="50">50</button>
                        <button class="bet-btn" data-bet="100">100</button>
                        <button class="bet-btn" data-bet="500">500</button>
                    </div>
                </div>

                <div class="action-row">
                    <button id="deal-btn" class="primary-btn deal" disabled>DEAL</button>
                    <button id="hit-btn" class="primary-btn hit" disabled>HIT</button>
                    <button id="stand-btn" class="primary-btn stand" disabled>STAND</button>
                    <button id="double-btn" class="primary-btn double" disabled>DOUBLE</button>
                </div>

                <div class="rules">
                    <h2>RULES</h2>
                    <div class="rule-row"><span>Blackjack pays</span><span>3:2</span></div>
                    <div class="rule-row"><span>Standard win</span><span>1:1</span></div>
                    <div class="rule-row"><span>Dealer stands on</span><span>17 (S17)</span></div>
                    <div class="rule-row"><span>Decks</span><span>6</span></div>
                </div>

                <div class="history" id="history">
                    <h2>RECENT HANDS</h2>
                    <div id="history-list"></div>
                </div>
            </div>
        </div>

        <div class="footer">House rules apply · server-side shoe</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/js/socket-init.js"></script>
    <script src="js/game.js"></script>
    <script src="/shared/js/achievement-toast.js"></script>
</body>
</html>
