<!DOCTYPE html>
<html lang="de">
<head>
        <script src="/shared/js/iframe-helper.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/css/theme.css">
    <link rel="stylesheet" href="crash.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <a class="back-link" href="/games/casino/">CASINO</a>
            <div class="title">CRASH</div>
            <div class="balance">Balance: <span id="balance-display">…</span> SC</div>
        </div>

        <div class="machine">
            <div class="machine-left">
                <div class="curve-wrap">
                    <canvas id="crash-curve" width="900" height="500"></canvas>
                    <div class="curve-overlay">
                        <div class="state-pill" id="state-pill">CONNECTING…</div>
                        <div class="multiplier-display" id="multiplier-display">1.00×</div>
                        <div class="state-sub" id="state-sub"></div>
                    </div>
                    <div class="recent-crashes" id="recent-crashes"></div>
                </div>
                <div class="status" id="status" data-kind="info">Place a bet during the betting phase.</div>
            </div>

            <div class="controls">
                <div class="block">
                    <div class="block-label">YOUR BET</div>
                    <div class="bet-info" id="bet-info">No active bet</div>
                </div>

                <div class="block">
                    <div class="block-label">BET</div>
                    <div class="bets" id="bet-grid">
                        <button class="bet-btn" data-bet="5">5</button>
                        <button class="bet-btn" data-bet="10">10</button>
                        <button class="bet-btn" data-bet="25">25</button>
                        <button class="bet-btn" data-bet="50">50</button>
                        <button class="bet-btn" data-bet="100">100</button>
                        <button class="bet-btn" data-bet="500">500</button>
                    </div>
                </div>

                <div class="block">
                    <div class="block-label">AUTO CASH-OUT (×, optional)</div>
                    <input id="auto-cashout" type="number" step="0.1" min="1.01" max="10000" placeholder="e.g. 2.00" />
                </div>

                <div class="actions">
                    <button id="bet-btn" class="primary-btn bet" disabled>PLACE BET</button>
                    <button id="cashout-btn" class="primary-btn cashout" disabled>CASH OUT</button>
                </div>

                <div class="audio-row">
                    <button id="sound-toggle" class="aux-btn" type="button">SOUND: ON</button>
                </div>

                <div class="players-block">
                    <h2>PLAYERS THIS ROUND</h2>
                    <div id="players-list" class="players-list"></div>
                </div>
            </div>
        </div>

        <div class="footer">Launch 0.00× → 1.00× in 3 s · bailing out below 1.00× returns less than your stake · 96 % RTP regardless of target</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/js/socket-init.js"></script>
    <script src="js/game.js"></script>
    <script src="/shared/js/achievement-toast.js"></script>
</body>
</html>
