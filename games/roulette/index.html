<!DOCTYPE html>
<html lang="de">
<head>
        <script src="/shared/js/iframe-helper.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link rel="stylesheet" href="/shared/css/theme.css">
    <link rel="stylesheet" href="roulette.css">
    <link rel="stylesheet" href="/shared/fonts/press-start-2p.css">
</head>
<body>
    <div class="page">
        <div class="header">
            <a class="back-link" href="/games/casino/">CASINO</a>
            <div class="title">ROULETTE</div>
            <div class="balance">Balance: <span id="balance-display">…</span> SC</div>
        </div>

        <div class="machine">
            <div class="left">
                <div class="wheel-wrap">
                    <canvas id="wheel-canvas" width="380" height="380"></canvas>
                    <div class="wheel-pointer">▼</div>
                    <div class="wheel-result" id="wheel-result" hidden>
                        <div class="wheel-result-num" id="wheel-result-num">0</div>
                        <div class="wheel-result-label" id="wheel-result-label">—</div>
                    </div>
                </div>
                <div class="status" id="status" data-kind="info">Place bets, then spin.</div>
                <div class="recent-row" id="recent-row"></div>
            </div>

            <div class="right">
                <div class="block">
                    <div class="block-label">CHIP</div>
                    <div class="bets" id="chip-grid">
                        <button class="bet-btn" data-bet="5">5</button>
                        <button class="bet-btn active" data-bet="10">10</button>
                        <button class="bet-btn" data-bet="25">25</button>
                        <button class="bet-btn" data-bet="50">50</button>
                        <button class="bet-btn" data-bet="100">100</button>
                        <button class="bet-btn" data-bet="500">500</button>
                    </div>
                </div>

                <div class="board">
                    <div class="board-zero" data-bet="straight" data-value="0">0</div>
                    <div class="board-grid" id="number-grid"></div>
                    <div class="dozen-row">
                        <button class="outside-btn" data-bet="dozen1">1ST 12</button>
                        <button class="outside-btn" data-bet="dozen2">2ND 12</button>
                        <button class="outside-btn" data-bet="dozen3">3RD 12</button>
                    </div>
                    <div class="outside-row">
                        <button class="outside-btn" data-bet="low">1-18</button>
                        <button class="outside-btn" data-bet="even">EVEN</button>
                        <button class="outside-btn red" data-bet="red">RED</button>
                        <button class="outside-btn black" data-bet="black">BLACK</button>
                        <button class="outside-btn" data-bet="odd">ODD</button>
                        <button class="outside-btn" data-bet="high">19-36</button>
                    </div>
                    <div class="col-row">
                        <button class="outside-btn small" data-bet="col1">2:1</button>
                        <button class="outside-btn small" data-bet="col2">2:1</button>
                        <button class="outside-btn small" data-bet="col3">2:1</button>
                    </div>
                </div>

                <div class="active-bets">
                    <h2>ACTIVE BETS · <span id="bet-count">0</span> / 12 · TOTAL <span id="bet-total">0</span> SC</h2>
                    <div id="bet-list"></div>
                </div>

                <div class="action-row">
                    <button id="spin-btn" class="primary-btn spin" disabled>SPIN</button>
                    <button id="clear-btn" class="primary-btn clear">CLEAR</button>
                </div>
            </div>
        </div>

        <div class="footer">European wheel · single zero · 97.30% RTP on every bet type</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/js/socket-init.js"></script>
    <script src="js/game.js"></script>
    <script src="/shared/js/achievement-toast.js"></script>
</body>
</html>
