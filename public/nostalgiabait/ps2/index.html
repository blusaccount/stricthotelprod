<!DOCTYPE html>
<html lang="de">
<head>
        <script src="/shared/js/iframe-helper.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PlayStation 2 - Nostalgiabait</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👽</text></svg>">
    <link rel="stylesheet" href="/nostalgiabait/shared/player.css">
    <style>
        :root { --accent-color: #4488ff; }
        .start-text { color: #4488ff; text-shadow: 0 0 20px rgba(68,136,255,0.5); }
        .start-hint { color: #2a5599; }
    </style>
    <link rel="stylesheet" href="/shared/fonts/orbitron.css">
    <link rel="stylesheet" href="/shared/fonts/mplus-rounded-1c.css">
    <script src="/shared/js/yt-consent.js"></script>
</head>
<body>

    <a href="/nostalgiabait/" id="home-btn" title="Back to Nostalgiabait">🏠</a>

    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <div id="start-overlay">
        <div class="start-panel">
            <div class="start-icon">🎮</div>
            <div class="start-text">CLICK TO START</div>
            <div class="start-hint">PlayStation 2 Boot Sequence</div>
        </div>
    </div>

    <div id="player-controls" class="player-controls">
        <button id="btn-back" class="ctrl-btn">← BACK</button>
        <button id="btn-replay" class="ctrl-btn">↻ REPLAY</button>
    </div>

    <div id="error-screen">
        <div class="error-icon">⚠</div>
        <div class="error-text">VIDEO NOT AVAILABLE</div>
        <div class="error-sub">YouTube video not configured</div>
        <a href="/nostalgiabait/" class="ctrl-btn ctrl-btn-error-back">← BACK</a>
    </div>

    <script src="/nostalgiabait/shared/player.js"></script>
</body>
</html>
