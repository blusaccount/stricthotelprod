<!DOCTYPE html>
<html lang="de">
<head>
        <script src="/shared/js/iframe-helper.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PlayStation 1 - Nostalgiabait</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👽</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/nostalgiabait/shared/player.css">
    <style>
        :root { --accent-color: #d9d9d9; }
        .start-text { color: #d9d9d9; text-shadow: 0 0 20px rgba(217,217,217,0.5); }
        .start-hint { color: #999999; }
    </style>
</head>
<body>

    <a href="/nostalgiabait/" id="home-btn" title="Back to Nostalgiabait">🏠</a>

    <div id="yt-player-container">
        <div id="yt-player"></div>
    </div>

    <div id="start-overlay">
        <div class="start-panel">
            <div class="start-icon">🕹</div>
            <div class="start-text">CLICK TO START</div>
            <div class="start-hint">PlayStation 1 Boot Sequence</div>
        </div>
    </div>

    <div id="player-controls" class="player-controls">
        <button id="btn-back" class="ctrl-btn">← BACK</button>
        <button id="btn-replay" class="ctrl-btn">↻ REPLAY</button>
    </div>

    <div id="error-screen">
        <div class="error-icon">⚠</div>
        <div class="error-text">VIDEO NOT AVAILABLE</div>
        <div class="error-sub">YouTube video not configured</div>
        <a href="/nostalgiabait/" class="ctrl-btn ctrl-btn-error-back">← BACK</a>
    </div>

    <script src="/nostalgiabait/shared/player.js"></script>
</body>
</html>
