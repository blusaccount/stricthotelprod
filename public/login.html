<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StrictHotel</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👽</text></svg>">
    <link rel="stylesheet" href="/shared/css/theme.css">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            color: var(--arcade-ink);
            image-rendering: pixelated;
            background:
                radial-gradient(circle at 30% 10%, rgba(255, 62, 165, 0.16) 0%, transparent 50%),
                radial-gradient(circle at 70% 90%, rgba(62, 255, 225, 0.12) 0%, transparent 50%),
                radial-gradient(circle at top, var(--arcade-bg-1) 0%, var(--arcade-bg-2) 70%);
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: linear-gradient(180deg, var(--arcade-panel) 0%, var(--arcade-panel-2) 100%);
            border: 3px solid var(--arcade-frame);
            padding: 36px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(255, 62, 165, 0.2), inset 0 0 0 1px rgba(255,255,255,0.04);
            position: relative;
            overflow: hidden;
        }
        .login-box::before {
            /* CRT scanlines */
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(180deg, transparent 0, transparent 2px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0.18) 3px);
            mix-blend-mode: multiply;
            opacity: 0.5;
            pointer-events: none;
        }
        .login-box > * { position: relative; z-index: 1; }

        .login-title {
            font-size: clamp(20px, 4vw, 28px);
            color: var(--arcade-gold);
            text-shadow: 0 2px 0 #000, 0 0 20px rgba(255, 204, 51, 0.7), 0 0 40px rgba(255, 62, 165, 0.45);
            margin-bottom: 6px;
            letter-spacing: 5px;
            animation: titlePulse 2.4s ease-in-out infinite;
        }
        .login-title-accent {
            color: var(--arcade-magenta);
            text-shadow: 0 2px 0 #000, 0 0 16px var(--arcade-magenta);
        }
        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 2px 0 #000, 0 0 20px rgba(255, 204, 51, 0.6), 0 0 40px rgba(255, 62, 165, 0.4); }
            50%      { text-shadow: 0 2px 0 #000, 0 0 32px rgba(255, 204, 51, 0.9), 0 0 56px rgba(255, 62, 165, 0.6); }
        }

        .login-subtitle {
            color: var(--arcade-dim);
            font-size: 9px;
            letter-spacing: 2px;
            margin-bottom: 28px;
        }

        .login-input {
            width: 100%;
            background: #120a1c;
            border: 2px solid var(--arcade-border);
            color: var(--arcade-ink);
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            padding: 14px 16px;
            margin-bottom: 18px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 4px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-input::placeholder { color: var(--arcade-dim); letter-spacing: 1px; }
        .login-input:focus {
            outline: none;
            border-color: var(--arcade-cyan);
            box-shadow: 0 0 0 1px var(--arcade-cyan), 0 0 20px rgba(62, 255, 225, 0.45);
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(180deg, #ffe278 0%, #d49100 100%);
            border: 3px solid var(--arcade-gold);
            color: #1a1200;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            font-weight: bold;
            padding: 14px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: transform 0.08s, box-shadow 0.15s;
            box-shadow: 0 4px 0 #6a4a00, 0 0 18px rgba(255, 204, 51, 0.4);
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 0 #6a4a00, 0 0 28px rgba(255, 204, 51, 0.7);
        }
        .login-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #6a4a00;
        }

        .error-message {
            color: var(--arcade-loss);
            font-size: 9px;
            letter-spacing: 1px;
            margin-top: 16px;
            display: none;
            text-shadow: 0 0 10px rgba(255, 56, 56, 0.6);
        }
        .error-message.show { display: block; }

        @media (max-width: 480px) {
            .login-box { padding: 28px 20px; }
            .login-title { font-size: 18px; letter-spacing: 3px; }
            .login-input, .login-btn { font-size: 11px; }
        }
    </style>
    <link rel="stylesheet" href="/shared/fonts/press-start-2p.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-title">STRICT <span class="login-title-accent">HOTEL</span></div>
            <div class="login-subtitle">PASSWORD GESCHÜTZT</div>

            <form id="login-form">
                <input
                    type="password"
                    class="login-input"
                    id="password"
                    placeholder="passwort"
                    autocomplete="off"
                    autofocus
                >
                <button type="submit" class="login-btn">EINTRETEN</button>
                <div class="error-message" id="error-message">FALSCHES PASSWORT</div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.remove('show');

            const password = passwordInput.value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorMessage.textContent = 'FALSCHES PASSWORT';
                    errorMessage.classList.add('show');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'VERBINDUNGSFEHLER';
                errorMessage.classList.add('show');
            }
        });
    </script>
<div class="login-legal">
    <a href="/impressum.html">Impressum</a>
    <a href="/datenschutz.html">Datenschutz</a>
</div>

<style>
    .login-legal {
        position: fixed;
        bottom: 14px;
        left: 0;
        right: 0;
        text-align: center;
    }
    .login-legal a {
        color: #888;
        font-size: 8px;
        letter-spacing: 1px;
        text-decoration: none;
        margin: 0 10px;
    }
    .login-legal a:hover { color: #3effe1; text-decoration: underline; }
</style>

</body>
</html>
