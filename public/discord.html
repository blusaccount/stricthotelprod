<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrictHotel</title>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0d0d14;
            color: #e8e8f0;
            font-family: system-ui, sans-serif;
            text-align: center;
        }
        .box { padding: 24px; max-width: 360px; }
        .spinner {
            width: 32px; height: 32px; margin: 0 auto 16px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #7289da;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #ff6b6b; font-size: 14px; margin-top: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="box">
    <div class="spinner" id="spinner"></div>
    <div id="status">Connecting to Discord…</div>
    <div class="error" id="error" hidden></div>
</div>

<!-- Public client ID only — never the client secret. -->
<script src="/discord-config.js"></script>
<!-- Self-hosted vendor bundle of @discord/embedded-app-sdk (IIFE build), see LLM_AGENT_GUIDE.md -->
<script src="/vendor/discord-embedded-app-sdk.js"></script>
<script>
(function () {
    'use strict';

    var statusEl = document.getElementById('status');
    var spinnerEl = document.getElementById('spinner');
    var errorEl = document.getElementById('error');
    var NAME_KEY = 'stricthotel-name';

    function fail(message, detail) {
        spinnerEl.hidden = true;
        statusEl.textContent = message;
        if (detail) {
            errorEl.hidden = false;
            errorEl.textContent = detail;
        }
    }

    async function boot() {
        if (!window.DISCORD_CLIENT_ID) {
            return fail('Discord activity is not configured on this server.',
                'DISCORD_CLIENT_ID is not set.');
        }
        if (!window.DiscordEmbeddedAppSdk) {
            return fail('Could not load the Discord SDK.');
        }

        var discordSdk = new window.DiscordEmbeddedAppSdk.DiscordSDK(window.DISCORD_CLIENT_ID);
        await discordSdk.ready();

        statusEl.textContent = 'Requesting authorization…';
        var auth = await discordSdk.commands.authorize({
            client_id: window.DISCORD_CLIENT_ID,
            response_type: 'code',
            state: '',
            prompt: 'none',
            scope: ['identify']
        });

        statusEl.textContent = 'Signing in…';
        // Dynamic fetches from inside the activity iframe must go through
        // Discord's fixed /.proxy/ alias for the root URL mapping — a plain
        // relative path here would not reach our backend. Static <script>
        // loads above don't need this; only JS-initiated network calls do.
        var res = await fetch('/.proxy/api/discord/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: auth.code })
        });
        if (!res.ok) {
            var body = await res.json().catch(function () { return {}; });
            throw new Error(body.error || ('HTTP ' + res.status));
        }
        var data = await res.json();

        // Completes the SDK's own auth state (needed for later SDK calls
        // like participant lists); not required for our session cookie,
        // which /api/discord/session already set.
        await discordSdk.commands.authenticate({ access_token: data.access_token });

        // Prefill the name field with the Discord display name, but never
        // overwrite a name the player already chose on this device.
        try {
            if (!localStorage.getItem(NAME_KEY) && data.suggestedName) {
                localStorage.setItem(NAME_KEY, data.suggestedName);
            }
            sessionStorage.setItem('sh-discord-activity', '1');
        } catch (e) {}

        // Session cookie is set now — reload into the real app, which will
        // pass the auth middleware normally from here on.
        location.href = '/';
    }

    boot().catch(function (err) {
        console.error('Discord activity bootstrap failed:', err);
        fail('Could not sign in via Discord.', err && err.message);
    });
})();
</script>
</body>
</html>
